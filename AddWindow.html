<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <title>Add Shopping List Item</title>
    <!-- Tight CSP: no unsafe-eval/inline for scripts -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self';
               object-src 'none';
               base-uri 'none';
               form-action 'self'"
    />
  </head>
  <body>
    <div class="container">
      <form id="add-form">
        <div>
          <label for="item">Enter Item</label>
          <input type="text" id="item" autofocus />
        </div>
        <button class="btn waves-effect waves-light" type="submit">
          Add Item
        </button>
      </form>
    </div>

    <!-- External script (no inline JS) -->
    <script src="./addWindow.js"></script>
  </body>
</html>
